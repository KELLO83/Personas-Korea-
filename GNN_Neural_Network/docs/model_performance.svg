<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Hobby Recommender Core Experiment Comparison</title>
  <desc id="desc">Grouped bar chart comparing Test Recall@10 and Test NDCG@10 for core hobby recommender experiments.</desc>
  <rect width="1200" height="620" fill="#050505"/>
  <text x="600" y="56" fill="#f7f7f7" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Core Experiment Performance</text>
  <text x="600" y="86" fill="#bfbfbf" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">Test Recall@10 and NDCG@10 · current split · fixed Stage1 candidate pool</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#eeeeee">
    <rect x="360" y="110" width="22" height="14" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
    <text x="390" y="122">Test Recall@10</text>
    <rect x="548" y="110" width="22" height="14" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
    <text x="578" y="122">Test NDCG@10</text>
  </g>

  <g transform="translate(92,154)">
    <line x1="0" y1="360" x2="1056" y2="360" stroke="#5b5b5b" stroke-width="1"/>
    <line x1="0" y1="308.6" x2="1056" y2="308.6" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="257.1" x2="1056" y2="257.1" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="205.7" x2="1056" y2="205.7" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="154.3" x2="1056" y2="154.3" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="102.9" x2="1056" y2="102.9" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="51.4" x2="1056" y2="51.4" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#303030" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="360" stroke="#5b5b5b" stroke-width="1"/>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e6e6e6" text-anchor="end">
      <text x="-12" y="365">0%</text>
      <text x="-12" y="314">10%</text>
      <text x="-12" y="262">20%</text>
      <text x="-12" y="211">30%</text>
      <text x="-12" y="160">40%</text>
      <text x="-12" y="108">50%</text>
      <text x="-12" y="57">60%</text>
      <text x="-12" y="5">70%</text>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#f2f2f2" text-anchor="middle">
      <g transform="translate(100,0)">
        <rect x="-28" y="61.9" width="24" height="298.1" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
        <rect x="4" y="174.7" width="24" height="185.3" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
        <text y="389"><tspan x="0">no-text</tspan><tspan x="0" dy="17">LightGBM</tspan></text>
      </g>

      <g transform="translate(318,0)">
        <rect x="-28" y="42.5" width="24" height="317.5" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
        <rect x="4" y="161.4" width="24" height="198.6" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
        <text y="389"><tspan x="0">KURE-v1</tspan><tspan x="0" dy="17">single</tspan></text>
      </g>

      <g transform="translate(536,0)">
        <rect x="-28" y="39.2" width="24" height="320.8" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
        <rect x="4" y="157.4" width="24" height="202.6" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
        <text y="389"><tspan x="0">E5-small</tspan><tspan x="0" dy="17">single</tspan></text>
      </g>

      <g transform="translate(754,0)">
        <rect x="-28" y="32.1" width="24" height="327.9" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
        <rect x="4" y="152.8" width="24" height="207.2" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
        <text y="389"><tspan x="0">Snowflake-ko</tspan><tspan x="0" dy="17">single</tspan></text>
      </g>

      <g transform="translate(972,0)">
        <rect x="-28" y="9.8" width="24" height="350.2" fill="#ff5a83" opacity="0.86" stroke="#ff86a6" stroke-width="2"/>
        <rect x="4" y="135.4" width="24" height="224.6" fill="#f4c84f" opacity="0.86" stroke="#ffe082" stroke-width="2"/>
        <text y="389"><tspan x="0">E5-small</tspan><tspan x="0" dy="17">domain</tspan></text>
      </g>
    </g>

  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#bfbfbf">
    <text x="32" y="342" transform="rotate(-90 32 342)" text-anchor="middle">Metric value</text>
    <text x="600" y="594" text-anchor="middle">Core comparison experiments</text>
  </g>
</svg>
